name: Katabump Auto Renew Extra

on:
  schedule:
    - cron: '10 8 */4 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renew:
    concurrency:
      group: katabump-renew
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb netcat-openbsd
        npm ci
        npx playwright install-deps chrome

    # 后面把你原工作流 renew 里面的步骤原样复制过来
